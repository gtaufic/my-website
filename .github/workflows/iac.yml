name: iac

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation for this branch's environment
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

# Share the deployment lock with the website workflow for this branch.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop for dev or main for production
        run: |
          case "$GITHUB_REF" in
            refs/heads/develop|refs/heads/main) ;;
            *) echo 'IaC runs only on develop (dev) or main (production).' >&2; exit 1 ;;
          esac

  validate:
    needs: check-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform -chdir=iac fmt -check -recursive
      - run: terraform -chdir=iac init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=iac validate
      - run: bash -n scripts/deploy-website.sh
      - run: bash -n scripts/terraform-init

  iac:
    needs: validate
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_VAR_github_repository_owner_id: ${{ github.repository_owner_id }}
      TARGET_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check project settings
        env:
          GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          : "${GCP_PROJECT_ID:?Set the GitHub variable GCP_PROJECT_ID.}"
          [[ "$GCP_PROJECT_NUMBER" =~ ^[0-9]+$ ]] || { echo 'Set the GitHub variable GCP_PROJECT_NUMBER.' >&2; exit 1; }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/my-website-${{ env.TARGET_ENVIRONMENT }}-github/providers/github
          service_account: my-website-${{ env.TARGET_ENVIRONMENT }}-iac@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Initialize remote state
        run: terraform -chdir=iac init -input=false -lockfile=readonly -backend-config="environments/$TARGET_ENVIRONMENT/state.hcl"
      - name: Plan
        run: terraform -chdir=iac plan -input=false -lock-timeout=5m -var-file="environments/$TARGET_ENVIRONMENT/terraform.tfvars" -out=tfplan
      - name: Apply
        if: inputs.operation == 'apply'
        run: terraform -chdir=iac apply -input=false -lock-timeout=5m tfplan
      - name: Remove plan
        if: always()
        run: rm -f iac/tfplan
